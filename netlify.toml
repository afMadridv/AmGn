# Sitio estático: no hay nada que compilar, se publica la carpeta tal cual.
# Lo único con servidor es la función que lee la lista de canciones de la
# playlist, porque eso el navegador no lo puede hacer (CORS).
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# --------------------------------------------------------------------------
# Seguridad
# --------------------------------------------------------------------------
# Una página web NO puede leer archivos del ordenador de quien la visita, ni
# con "Inspeccionar elemento": ahí sólo se ve lo que la propia página trae.
# Lo que sí se puede endurecer es lo de fuera, y de eso va esto:
#
#   · Content-Security-Policy dice de qué sitios se permite cargar cosas. Si
#     alguien lograra colar un script (por ejemplo en el título de un dibujo),
#     el navegador lo bloquearía, y tampoco podría mandar nada a un servidor
#     que no esté en esta lista.
#   · Permissions-Policy apaga cámara, micrófono, ubicación y demás: la página
#     no puede ni pedirlos.
#   · frame-ancestors impide que otro sitio meta el jardín dentro del suyo
#     para engañar a quien lo abra.
#
# El 'unsafe-eval' está ahí porque la API de Spotify usa eval() y sin él la
# música no arranca (comprobado: se queda en "cargando…"). Sólo permite que
# los scripts YA permitidos usen eval; meter uno nuevo sigue estando cerrado,
# que es lo que de verdad importa.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-eval' https://cdn.jsdelivr.net https://open.spotify.com https://*.spotifycdn.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://*.supabase.co https://*.scdn.co https://*.spotifycdn.com;
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://open.spotify.com https://*.spotifycdn.com;
      frame-src https://open.spotify.com;
      media-src 'self' https://*.scdn.co;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
    """
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=(), midi=(), magnetometer=(), accelerometer=(), gyroscope=(), serial=(), bluetooth=(), local-fonts=(), idle-detection=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"

# El HTML no se cachea, para que un cambio se vea al recargar. Los ficheros
# de css/js sí, pero poco: el sitio es pequeño y conviene que llegue fresco.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
